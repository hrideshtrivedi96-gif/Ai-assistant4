name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git python3-dev libffi-dev libssl-dev zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config ccache
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Configure and Build APK
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        sed -i "s/#requirements = python3/requirements = python3,kivy/" buildozer.spec
        sed -i "s/requirements = python3/requirements = python3,kivy/" buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ai-assistant-apk
        path: bin/*.apk
